<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Importación de la hoja de estilos de bootstrap-->

    <!-- Importacion de la hoja de estilos css -->
    <link rel="stylesheet" href="style.css">
    <!-- Importancio de Font de Google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg my-nav-personalized sticky-top" data-bs-theme="dark">
            <div class="container-fluid">
                <!-- Zona destinada al logotipo o marca -->
                <a class="navbar-brand" href="index.html">
                    <img class="img-itus" src="images/condor.png" alt="Logo ITUS">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
                    aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarColor01">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="carrera.html">CARRERAS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sedes.html">SEDES</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sobre-nosotros.html">NOSOTROS</a>

                        <li class="nav-item">
                            <a class="nav-link active" href="contactos.html">CONTACTOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="noticias.html">NOTICIAS</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Sección de Contacto ITUS -->
    <section class="seccion-contacto"> 
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-9 col-lg-7 col-xl-6">
                    <!-- Tarjeta del formulario -->
                    <div class="card border-0 contacto-card">
                        <div class="card-body p-4 p-md-5">

                            <!-- Cabecera del Formulario con Ícono de Contacto -->
                            <div class="text-center mb-4">
                                <div class="d-inline-flex align-items-center justify-content-center mb-3 rounded-circle shadow-sm"
                                    style="width: 64px; height: 64px; background-color: rgba(30, 24, 53, 0.08); color: var(--itus-purple-dark);">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M16 8c0 3.866-3.582 7-8 7a9 9 0 0 1-2.347-.306c-.584.296-1.925.864-4.181 1.234-.2.032-.352-.176-.273-.362.354-.836.674-1.95.77-2.966C.744 11.37 0 9.76 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7M5 8a1 1 0 1 0-2 0 1 1 0 0 0 2 0m4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0m4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0"/>
                                    </svg>
                                </div>
                                <h2 class="fw-bold" style="color: var(--itus-purple-dark);">FORMULARIO DE CONTACTO</h2>
                                <p class="text-muted">¿Tienes dudas sobre nuestras carreras o tu proceso de admisión?
                                    Escríbenos.</p>
                            </div>

                            <form>
                                <!-- Nombre Completo -->
                                <div class="mb-3">
                                    <label for="nombre" class="form-label fw-bold">Nombre Completo</label>
                                    <input type="text" class="form-control border-2 rounded-4 p-3" id="nombre"
                                        placeholder="Ej: Juan Pérez">
                                </div>

                                <!-- Correo Electrónico -->
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-bold">Correo Electrónico</label>
                                    <input type="email" class="form-control border-2 rounded-4 p-3" id="email"
                                        placeholder="Ej: juan.perez@ejemplo.com">
                                </div>

                                <!-- Teléfono -->
                                <div class="mb-3">
                                    <label for="telefono" class="form-label fw-bold">Teléfono</label>
                                    <input type="tel" class="form-control border-2 rounded-4 p-3" id="telefono"
                                        placeholder="Ej: +56 9 1234 5678">
                                </div>

                                <!-- Asunto (Selección) -->
                                <div class="mb-3">
                                    <label for="asunto" class="form-label fw-bold">Asunto</label>
                                    <select class="form-select border-2 rounded-4 p-3" id="asunto">
                                        <option selected>Selecciona una opción...</option>
                                        <option value="1">Admisión / Matrículas</option>
                                        <option value="2">Consultas Académicas</option>
                                        <option value="3">Financiamiento</option>
                                        <option value="4">Otro</option>
                                    </select>
                                </div>

                                <!-- Mensaje -->
                                <div class="mb-4">
                                    <label for="mensaje" class="form-label fw-bold">Mensaje</label>
                                    <textarea class="form-control border-2 rounded-4 p-3" id="mensaje" rows="4"
                                        placeholder="Escribe aquí tu consulta..."></textarea>
                                </div>

                                <!-- Botón de Enviar (Estilo ITUS) -->
                                <div class="d-grid">
                                    <button type="submit"
                                        class="btn btn-itus-red btn-lg border-0 rounded-4 fw-bold py-3">
                                        ENVIAR MENSAJE
                                    </button>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>   
    </section>  
        <!-- Importacion de js para funcionamiento de bootstrap-->
    <script src="js/bootstrap.min.js"></script>
</body>
</html>
